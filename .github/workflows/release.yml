name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges $PREV_TAG..HEAD)
          fi

          # Write changelog to file for multiline output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## 更新内容" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Windows amd64
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.defaultAPIPortStr=9090 -X netdispatch/pkg/version.Version=${{ steps.version.outputs.VERSION }} -X netdispatch/pkg/version.GitCommit=$(git rev-parse HEAD) -X netdispatch/pkg/version.BuildDate=$BUILD_DATE" -o bin/netdispatch-windows-amd64.exe ./cmd/netdispatch

      - name: Build Linux amd64
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.defaultAPIPortStr=9090 -X netdispatch/pkg/version.Version=${{ steps.version.outputs.VERSION }} -X netdispatch/pkg/version.GitCommit=$(git rev-parse HEAD) -X netdispatch/pkg/version.BuildDate=$BUILD_DATE" -o bin/netdispatch-linux-amd64 ./cmd/netdispatch

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            bin/netdispatch-windows-amd64.exe
            bin/netdispatch-linux-amd64
          draft: false
          prerelease: false
